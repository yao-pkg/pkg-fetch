name: Build Node binaries for Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: ${{ matrix.arch.os }}
    name: windows-${{ matrix.arch.name }} (${{ matrix.target-node }})

    strategy:
      fail-fast: false
      matrix:
        target-node: [22, 24, 26]
        arch:
          - name: x64
            os: windows-2022
          - name: arm64
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          check-latest: true

      - run: yarn install --ignore-engines

      - run: choco install nasm

      # windows-11-arm ships only VS 2026, but Node 22's vcbuild.bat only detects VS 2022
      - name: Install VS 2022 Build Tools
        if: matrix.arch.name == 'arm64' && matrix.target-node == 22
        run: |
          Invoke-WebRequest https://aka.ms/vs/17/release/vs_buildtools.exe -OutFile vs_buildtools.exe
          $p = Start-Process -Wait -PassThru vs_buildtools.exe -ArgumentList '--quiet', '--wait', '--norestart', '--nocache', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended', '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64', '--add', 'Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - run: yarn start --node-range node${{ matrix.target-node }} --arch ${{ matrix.arch.name }} --output dist

      - name: Check if binary is compiled, skip if download only
        id: check_file
        run: |
          ls dist
          if (Test-Path -Path dist\\*.sha256sum -PathType Leaf) { 
            "EXISTS=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else { 
            "EXISTS=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - uses: actions/upload-artifact@v7
        if: steps.check_file.outputs.EXISTS == 'true'
        with:
          name: node${{ matrix.target-node }}-windows-${{ matrix.arch.name }}
          path: dist\\*
